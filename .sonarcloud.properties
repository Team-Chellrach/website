# SonarCloud configuration for chellrach.com
#
# Like JollofTV, this uses SonarCloud Automatic Analysis: SonarCloud analyses
# the repository itself once the project is imported at sonarcloud.io, so there
# is no CI job and no token. The organisation and project are chosen at import,
# not set here (Automatic Analysis ignores sonar.projectKey/sonar.organization).

# Production code only.
sonar.sources=app,components,lib,scripts
sonar.tests=

# Generated or third-party content: logo SVGs from the designer, generated
# icons and images, build output.
sonar.exclusions=public/**/*,assets/**/*,out/**/*,.next/**/*

# Raise the duplication threshold a little: the home page holds several
# same-shaped content lists (services, principles, technologies).
sonar.cpd.min_tokens=150

sonar.sourceEncoding=UTF-8
